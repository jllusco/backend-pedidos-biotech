[phases.setup]
nixPkgs = ['php82', 'php82Extensions.mbstring', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.gd', 'php82Extensions.zip', 'php82Extensions.xml', 'php82Extensions.bcmath', 'php82Extensions.curl']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-gd']

[phases.build]
cmds = ['php artisan config:cache', 'php artisan route:cache', 'php artisan view:cache']

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=$PORT'
